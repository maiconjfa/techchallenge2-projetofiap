mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.112.0"

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
    batch:
      timeout: 1s
      send_batch_size: 1024
    resource:
      attributes:
        - key: deployment.environment
          value: demo
          action: upsert
        - key: service.namespace
          value: feature-flags
          action: upsert

  exporters:
    prometheus:
      endpoint: "0.0.0.0:8889"
      namespace: otel
    loki:
      endpoint: "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
      default_labels_enabled:
        exporter: false
        job: true
    datadog:
      api:
        site: ${DATADOG_SITE}
        key: ${DATADOG_API_KEY}
      traces:
        trace_buffer: 100

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource]
        exporters: [datadog]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource]
        exporters: [loki]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  health:
    enabled: true
    containerPort: 13133
    servicePort: 13133
    protocol: TCP

serviceMonitor:
  enabled: true

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.112.0
  pullPolicy: IfNotPresent

mode: deployment
replicaCount: 1
