apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "id": null,
      "uid": "togglemaster-overview",
      "title": "ToggleMaster - Overview",
      "tags": ["togglemaster", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Cluster CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Cluster Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 6 },
          "id": 3,
          "title": "HTTP Requests RPS by Service",
          "targets": [
            { "expr": "sum(rate(http_server_requests_total[1m])) by (job)", "legendFormat": "{{job}}" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 12 },
          "id": 4,
          "title": "HTTP 5xx Errors by Service",
          "targets": [
            { "expr": "sum(rate(http_server_requests_total{status=~\"5..\"}[5m])) by (job)", "legendFormat": "{{job}}" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": "Loki",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 18 },
          "id": 5,
          "options": { "showLabels": true, "showTime": true, "wrapLogMessage": true },
          "targets": [
            { "expr": "{namespace=\"feature-flags\"} |~ \".*\"", "refId": "A" }
          ],
          "title": "Logs (feature-flags) - Tempo Real",
          "type": "logs"
        }
      ]
    }
