apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: togglemaster-alerts
  namespace: observability
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: togglemaster.rules
      rules:
        - alert: AuthServiceHigh5xxRate
          expr: |
            (
              sum(rate(http_server_requests_total{job="auth-service", status=~"5.."}[5m]))
              /
              sum(rate(http_server_requests_total{job="auth-service"}[5m]))
            ) * 100 > 5
          for: 1m
          labels:
            severity: critical
            service: auth-service
          annotations:
            summary: "High HTTP 5xx rate on auth-service"
            description: "auth-service 5xx rate > 5% over last 5m ({{ $value | printf \"%.2f\" }}%)"
