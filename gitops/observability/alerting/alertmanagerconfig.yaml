apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-selfhealing
  namespace: observability
  labels:
    alertmanagerConfig: selfhealing
spec:
  route:
    groupBy: ['alertname', 'service']
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 1h
    receiver: 'critical-all'
    routes:
      - matchers:
          - name: alertname
            value: AuthServiceHigh5xxRate
        receiver: 'critical-all'
  receivers:
    - name: 'critical-all'
      webhookConfigs:
        - url: 'http://self-healing-webhook.self-healing.svc.cluster.local:8080/webhook'
          sendResolved: false
      pagerdutyConfigs:
        - routingKey:
            name: pagerduty-routing-key
            key: key
          sendResolved: true
          severity: '{{ if eq .Status "resolved" }}info{{ else }}critical{{ end }}'
          description: '[ToggleMaster] {{ .CommonLabels.alertname }} - {{ .Status | toUpper }} | {{ .CommonAnnotations.summary }}'
          client: 'ToggleMaster'
          clientURL: 'http://34.229.45.189:30124'
      slackConfigs:
        - apiURL:
            name: slack-webhook-url
            key: url
          channel: '#togglemaster-alerts'
          sendResolved: true
          username: 'Alertmanager'
          iconEmoji: '{{ if eq .Status "resolved" }}:white_check_mark:{{ else }}:rotating_light:{{ end }}'
          title: '{{ if eq .Status "resolved" }}[RESOLVIDO]{{ else }}[CRÍTICO]{{ end }} {{ .CommonAnnotations.summary }}'
          text: |-
            *Status:* {{ .Status | toUpper }}
            *Alerta:* {{ .CommonLabels.alertname }}
            *Motivo/Causa:* {{ .CommonAnnotations.description }}
            *Resumo:* {{ .CommonAnnotations.summary }}
            *Serviço:* {{ .CommonLabels.service }}
            *Namespace:* {{ .CommonLabels.namespace }}
            *Severidade (alerta):* {{ .CommonLabels.severity }}

            {{ if eq .Status "resolved" -}}
            *Situação:* Serviço restabelecido. Incidente/alerta resolvido e notificado no PagerDuty/Slack.
            {{- else -}}
            *Ações Automáticas:*
            • Self-Healing: kubectl rollout restart deployment/{{ .CommonLabels.service }} -n feature-flags (via webhook)
            • Incidente: Aberto/atualizado via PagerDuty
            • ChatOps: Notificação enviada para #togglemaster-alerts
            {{- end }}

            *Grafana:* http://34.229.45.189:30124/alerting/list
