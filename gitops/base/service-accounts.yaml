###############################################################################
# ServiceAccounts dos servicos que acessam recursos AWS.
# As credenciais vem da role da instancia EC2 (node role criada no modulo EKS
# do Terraform), que possui permissoes de SQS e DynamoDB.
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service
  namespace: feature-flags
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: feature-flags
