# EXEMPLO - NAO usar valores reais em producao.
#
# O arquivo REAL (gitops/base/secrets.yaml) e gerado automaticamente a partir
# dos outputs do Terraform:
#   cd terraform && AWS_PROFILE=tf ./scripts/generate-k8s-secrets.sh
#
# Para sobrescrever as chaves de aplicacao:
#   MASTER_KEY=suachave SERVICE_API_KEY=tm_key_xxx ./scripts/generate-k8s-secrets.sh
#
# O secrets.yaml gerado esta no .gitignore para evitar vazamento de credenciais.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: feature-flags
type: Opaque
data:
  DATABASE_URL_AUTH: "<base64>"
  DATABASE_URL_FLAG: "<base64>"
  DATABASE_URL_TARGETING: "<base64>"
  REDIS_URL: "<base64>"
  AWS_SQS_URL: "<base64>"
  MASTER_KEY: "<base64>"
  SERVICE_API_KEY: "<base64>"
