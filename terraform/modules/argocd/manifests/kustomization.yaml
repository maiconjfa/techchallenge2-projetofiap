###############################################################################
# Instalacao do ArgoCD via Kustomize puro (sem Helm).
#
# Manifests oficiais da release v2.13.3 vendados neste diretorio para que o
# apply seja deterministico. Para atualizar o ArgoCD:
#   curl -sL -o install.yaml \
#     https://raw.githubusercontent.com/argoproj/argo-cd/vX.Y.Z/manifests/install.yaml
#
# Acesso a UI (apos instalacao):
#   kubectl port-forward svc/argocd-server -n argocd 8080:443
#   usuario: admin
#   senha: kubectl -n argocd get secret argocd-initial-admin-secret \
#            -o jsonpath='{.data.password}' | base64 -d
###############################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - install.yaml

# Reducao de recursos do server para ambiente de lab.
# install.yaml v2.13.3 do argocd-server NAO define resources ->
# 'replace' falharia (path inexistente); usa-se 'add' no objeto inteiro.
patches:
  - target:
      kind: Deployment
      name: argocd-server
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
          limits:
            cpu: 500m
